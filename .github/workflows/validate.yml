name: WHAT IF WORLD validation

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python-version }} contract and unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.0.1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install schema-validation dependency
        run: python -m pip install -r requirements-dev.txt
      - name: Validate repository contracts
        run: python tools/validate_project.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Verify release gate rejects incomplete example
        shell: bash
        run: |
          if python tools/validate_manifest.py examples/production_manifest.example.json --release-gate; then
            echo "ERROR: incomplete example unexpectedly passed the release gate"
            exit 1
          else
            echo "PASS: incomplete example was correctly blocked from release"
          fi
